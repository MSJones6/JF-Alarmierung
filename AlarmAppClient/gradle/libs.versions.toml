[versions]
agp = "9.4.0"
kotlin = "2.3.10"
composeBom = "2026.08.00"
activityCompose = "1.12.3"
coreKtx = "1.17.0"
datastorePreferences = "1.2.0"
hivemqMqttClient = "1.3.12"
