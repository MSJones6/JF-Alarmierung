# nginx vor dem Frontend: statische Dateien plus Weiterleitung der REST-API.
server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# Alarm-API inklusive Server-Sent-Events zum Alarm-Stream.
	location /api/ {
		proxy_pass http://alarm-api:8080;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_buffering off;
		proxy_cache off;
		proxy_read_timeout 1d;
		proxy_send_timeout 1d;
	}

	# SPA: unbekannte Pfade auf index.html.
	location / {
		try_files $uri $uri/ /index.html;
	}
}
